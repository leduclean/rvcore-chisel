rules = [
  OrganizeImports,
  RemoveUnused,
  RedundantSyntax,
  ProcedureSyntax,
  DisableSyntax
]

# OrganizeImports
OrganizeImports.targetDialect = Auto

# RemoveUnused
RemoveUnused.imports = true
RemoveUnused.privateVals = true

# RedundantSyntax
RedundantSyntax.redundantBraces = true
RedundantSyntax.redundantUnitType = true

# ProcedureSyntax
ProcedureSyntax.autoFix = true

# DisableSyntax
DisableSyntax.noVars = true
DisableSyntax.noThrows = false
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noXml = true
DisableSyntax.noFinalVal = false
DisableSyntax.noFinalize = true
DisableSyntax.noValPatterns = true
