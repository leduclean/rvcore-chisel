version = "3.10.0"
runner.dialect = scala213 # Our Scala dialect (see `build.sc`)

# Indent and line length
maxColumn = 120
indent.main = 2
indent.callSite = 2 # function call parameters indent
indent.ctrlSite = 4 # Indent for control block
indent.defnSite = 4 # Indent for definition parameters
indent.ctorSite = 2

# Alignment
align.preset = more # Align operators for readability
align.allowOverflow = true
newlines.source = keep

# Newlines
newlines.source = keep # Manual line breaks are preserved
newlines.selectChains = fold
newlines.topLevelStatementBlankLines = [{ blanks { before = 1, after = 1 } }] # Blank line around top-level

# Comments / docstrings
comments.wrap = standalone
docstrings.style = SpaceAsterisk # Standard scaladoc style

danglingParentheses.preset = true
